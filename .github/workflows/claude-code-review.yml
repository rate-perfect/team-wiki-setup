# The shared Claude PR review: a thin caller of rate-perfect/claude-review's reusable workflow, copied from its
# examples/github-caller.yml. The pin is the version of the workflow and of the review core: a full commit SHA,
# never a branch. To move to a new release, change the SHA and its comment together.
# This repo's rules, config and environment notes are read from the PR's base branch:
#   .github/review-instructions.md, .github/claude-review/config.json, .github/claude-review/environment.md
#
# This repo is public, so the review's comments are public too.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time: a new push cancels the run that was reviewing the old head.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Skipped for two kinds of PR, which would fail every time (the job then shows as skipped):
    # - Dependabot's: their runs get Dependabot's secret store, which has no CLAUDE_CODE_OAUTH_TOKEN.
    # - PRs from a fork: GitHub gives them no secrets and a read-only token, so the review can't run or post.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # The most the called jobs may have. Each asks for less: the model job reads, the poster writes comments.
    permissions:
      contents: read
      pull-requests: write
    uses: rate-perfect/claude-review/.github/workflows/review.yml@25513fb71294d654c167b5a06213c3a437fc2165 # v1.1.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TEAMS_CI_HEALTH_WEBHOOK_URL: ${{ secrets.TEAMS_CI_HEALTH_WEBHOOK_URL }}
